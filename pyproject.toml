[project]
name = "flutter-docs-rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "numpy>=2.5.5",
    "openai>=3.58.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "sentence-transformers>=6.3.0",
    "uvicorn>=0.54.0",
]
